    <p>What's New</p>
  </div>

  <div class="profile">
    <button
      (click)="onProfileDropdown()"
      (blur)="closeProfileDropdown()"
      [class.hoverable]="!isProfileDropdown"
    >
      <img src="./examples/image.jpg" alt="profile picture" />
    </button>

    <p>User</p>

    <ul [style.display]="isProfileDropdown ? 'block' : 'none'">
      <li>
        <a [routerLink]="['user', 'User']"> Profile </a>
      </li>
      <li>
        <a [routerLink]="['preferences']"> Settings </a>
      </li>
      <li>
        <button>Logout</button>
      </li>
    </ul>
  </div>
